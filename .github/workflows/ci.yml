name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gymnasium,pettingzoo,pandas]"
      - name: ruff check
        run: ruff check sekai tests examples
      - name: ruff format
        run: ruff format --check sekai tests examples
      - name: mypy (strict)
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: pytest
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: CLI smoke test
        run: |
          sekai list
          sekai check CartPole-v1 --steps 200 --determinism
          sekai check Portfolio-v0 --steps 200
          sekai check Market-v0 --steps 200 --determinism
          sekai check LimitOrderBook-v0 --steps 200
          sekai bench Portfolio-v0 --num-envs 256 --steps 50

  minimum-versions:
    name: Test with minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "numpy==1.24.4" "cloudpickle==3.0.0" "gymnasium==1.0.0" "pillow==9.5.0" pytest
      - run: pip install --no-deps -e .
      - run: pytest

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[gymnasium,render]"
      - name: Run every example
        shell: bash
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import sekai; print(sekai.__version__); sekai.make('CartPole-v1')"
          /tmp/wheel-env/bin/sekai list
