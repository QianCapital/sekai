name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gymnasium,pettingzoo,pandas]"
      - name: ruff check
        run: ruff check sekai tests examples
      - name: ruff format
        run: ruff format --check sekai tests examples
      - name: mypy (strict)
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: pytest
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: CLI smoke test
        run: |
          sekai list
          sekai check CartPole-v1 --steps 200 --determinism
          sekai check Portfolio-v0 --steps 200
          sekai check Market-v0 --steps 200 --determinism
          sekai check LimitOrderBook-v0 --steps 200
          sekai bench Portfolio-v0 --num-envs 256 --steps 50
          sekai bench Trading-v0 --num-envs 256 --steps 50
          sekai check Chess-v0 --steps 200 --determinism
          sekai bench Go9x9-v0 --num-envs 2 --steps 50

  torch:
    name: Test with PyTorch (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]" stable-baselines3
      - name: pytest (the torch backend, batched envs and sekai.nn tests run here)
        run: pytest

  minimum-versions:
    name: Test with minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "numpy==1.24.4" "cloudpickle==3.0.0" "gymnasium==1.0.0" "pillow==9.5.0" pytest
      - run: pip install --no-deps -e .
      - run: pytest

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[gymnasium,render]"
      - name: Run every example
        shell: bash
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import sekai; print(sekai.__version__); sekai.make('CartPole-v1')"
          /tmp/wheel-env/bin/sekai list
      - name: Render from the installed wheel (its glyph atlases and brand artwork)
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python - <<'EOF'
          from importlib.metadata import files, metadata

          import sekai
          from sekai.envs.finance import TradingRenderer
          from sekai.rendering import brand

          assert "wheel-env" in sekai.__file__, sekai.__file__
          env = sekai.make("Trading-v0", episode_length=10)
          env.reset(seed=0)
          env.step(2)
          branded = TradingRenderer().render(env)  # serif atlas and brand artwork
          plain = TradingRenderer(branding=False).render(env)  # grotesk atlas only
          assert branded.shape == plain.shape == (450, 720, 3) and (branded != plain).any()
          assert brand.mark(42)[..., 3].max() > 200
          assert {"LICENSE", "OFL.txt", "TRADEMARKS"} <= {f.name for f in files("sekai")}
          assert "LicenseRef-Qian-Capital-Trademarks" in metadata("sekai")["License-Expression"]
          print("rendered branded and plain frames with", sekai.__file__)
          EOF
      - name: Draw the games from the installed wheel (their artwork and licences)
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python - <<'EOF'
          from importlib.metadata import files, metadata

          import numpy as np

          import sekai
          from sekai.envs.games import ChessRenderer, XiangqiRenderer

          assert "wheel-env" in sekai.__file__, sekai.__file__
          for env_id, renderer in (("Chess-v0", ChessRenderer), ("Xiangqi-v0", XiangqiRenderer)):
              env = sekai.make(env_id)
              env.reset(seed=0)
              frame = renderer().render(env)  # the pieces' and characters' artwork (.npz)
              assert frame.dtype == np.uint8 and frame.ndim == 3 and frame.std() > 10, env_id
          names = [f.name for f in files("sekai")]
          assert "LICENSE-chess-pieces.txt" in names and names.count("OFL.txt") >= 2, names
          expression = metadata("sekai")["License-Expression"]
          assert "BSD-3-Clause" in expression and "OFL-1.1" in expression, expression
          print("drew chess and xiangqi from", sekai.__file__)
          EOF
