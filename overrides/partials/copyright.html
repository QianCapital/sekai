{#-
  Material's copyright partial, with the Qian Capital wordmark added.
-#}
<div class="md-copyright">
  <a class="qc-footer-brand" href="https://qiancapital.com" target="_blank" rel="noopener" title="Qian Capital">
    <img src="{{ 'assets/brand/qian-capital.png' | url }}" alt="Qian Capital">
  </a>
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
</div>
